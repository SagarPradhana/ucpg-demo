[build]
  # Directory to change to before starting a build
  base = "."
  
  # Directory that contains the deploy-ready HTML files and assets
  publish = "dist"
  
  # Default build command
  command = "npm run build"

# Production context: all deploys from the main branch  
[context.production]
  environment = { VITE_API_BASE_URL = "/api", VITE_ENVIRONMENT = "production", VITE_USE_API_PROXY = "true" }

# Deploy Preview context: all Deploy Previews
[context.deploy-preview]
  environment = { VITE_API_BASE_URL = "https://ucpg-api-dev.onrender.com", VITE_ENVIRONMENT = "staging" }

# Branch deploy context: all deploys that are not from a pull/merge request
[context.branch-deploy]
  environment = { VITE_API_BASE_URL = "https://ucpg-api-dev.onrender.com", VITE_ENVIRONMENT = "development" }

# Redirect rules for SPA and API proxy
[[redirects]]
  from = "/api/*"
  to = "https://ucpg-api-dev.onrender.com/api/:splat"
  status = 200
  force = true
  headers = {X-From = "Netlify"}

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for CORS
[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"